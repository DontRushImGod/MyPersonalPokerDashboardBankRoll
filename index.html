<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M3 13h8L8 21l9-10h-8l3-8z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Bankroll Dashboard</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('darkMode');
          var isDark = saved ? JSON.parse(saved) : true;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111827;">
        <div style="text-align:center;">
          <div style="display:inline-block;width:48px;height:48px;border:4px solid #2563eb;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div>
          <p style="margin-top:16px;color:#9ca3af;font-family:system-ui,sans-serif;">Loading...</p>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      window.__diag = [];
      window.onerror = function(msg, url, line, col, err) {
        window.__diag.push('ERROR: ' + msg + ' at ' + url + ':' + line + ':' + col);
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:12px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;';
        d.textContent = 'JS ERROR: ' + msg + ' (' + (url||'').split('/').pop() + ':' + line + ')';
        document.body.appendChild(d);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        window.__diag.push('REJECTION: ' + (e.reason && e.reason.message || e.reason));
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:white;padding:12px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;';
        d.textContent = 'PROMISE REJECTION: ' + (e.reason && e.reason.message || e.reason);
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      setTimeout(function() {
        var root = document.getElementById('root');
        if (!root || root.children.length === 0 || (root.children.length === 1 && root.innerHTML.indexOf('Loading') !== -1)) {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1e40af;color:white;padding:12px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;';
          var info = 'STILL STUCK after 8s\\n';
          info += 'Root children: ' + (root ? root.children.length : 'no root') + '\\n';
          info += 'Root HTML: ' + (root ? root.innerHTML.substring(0,200) : 'none') + '\\n';
          info += 'Diag: ' + JSON.stringify(window.__diag) + '\\n';
          info += 'UA: ' + navigator.userAgent.substring(0,100);
          d.textContent = info;
          document.body.appendChild(d);
        }
      }, 8000);
    </script>
  </body>
</html>
